sources:
  - id: openalex
    name: OpenAlex
    role: core
    access_method: api
    base_url: https://api.openalex.org/works
    raw_path: data/raw/openalex/YYYY-MM-DD/
    notes: Broad scholarly metadata, concepts, authors, institutions, venues, and citation counts.
  - id: crossref
    name: Crossref
    role: core
    access_method: api
    base_url: https://api.crossref.org/works
    raw_path: data/raw/crossref/YYYY-MM-DD/
    notes: DOI-centered publisher metadata for dedupe, dates, venues, and source coverage.
  - id: arxiv
    name: arXiv
    role: supplemental
    access_method: api
    base_url: https://export.arxiv.org/api/query
    raw_path: data/raw/arxiv/YYYY-MM-DD/
    notes: Computational humanities, NLP-for-humanities, authorship, archive, and cultural analytics methods.
  - id: osf-preprints
    name: OSF Preprints / SocArXiv
    role: supplemental
    access_method: api
    base_url: https://api.osf.io/v2/preprints/
    raw_path: data/raw/osf-preprints/YYYY-MM-DD/
    notes: Recent preprints from SocArXiv and related OSF providers for humanities-adjacent social science, cultural sociology, political communication, and methods work.
  - id: hcommons
    name: Knowledge Commons Works / Humanities Commons
    role: core
    access_method: api
    base_url: https://works.hcommons.org/api/records
    raw_path: data/raw/hcommons/YYYY-MM-DD/
    notes: Humanities-focused open repository records, conference papers, datasets, presentations, and preprints from KCWorks/Humanities Commons.
  - id: nber
    name: NBER
    role: supplemental
    access_method: public-web-metadata
    base_url: https://www.nber.org/papers
    raw_path: data/raw/nber/YYYY-MM-DD/
    notes: Humanities-adjacent economic history, culture, institutions, migration, education history, and long-run historical data.
  - id: department-pages
    name: Department and research-center pages
    role: web-crawl
    access_method: public-web-snapshots
    raw_path: data/raw/department-pages/YYYY-MM-DD/
    notes: Public pages for humanities departments, centers, labs, dissertations, events, and publication lists. Coverage must be labeled separately.
